{% extends "base.html" %}
{% block title %}Регистрация — Зоомагазин{% endblock %}

{% block content %}
<form class="auth" method="post" action="{{ url_for('register') }}" novalidate>
  <h1>Регистрация</h1>
  <p class="sub">Создайте новую учётную запись</p>

  <div class="form-group">
    <label for="login">Логин</label>
    <input type="text" id="login" name="login" placeholder="Минимум 3 символа" required autofocus minlength="3">
  </div>
  <div class="form-group">
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" placeholder="Минимум 6 символов" required minlength="6">
  </div>
  <div class="form-group">
    <label for="confirm">Подтверждение пароля</label>
    <input type="password" id="confirm" name="confirm" placeholder="Повторите пароль" required minlength="6">
  </div>

  <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>

  <div class="auth-links">
    Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
  </div>
</form>
{% endblock %}
