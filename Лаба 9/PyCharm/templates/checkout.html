{% extends "base.html" %}
{% block title %}Оформление заказа — Зоомагазин{% endblock %}

{% block content %}
<div class="breadcrumbs"><a href="{{ url_for('cart') }}">Корзина</a> → Оформление</div>

<form class="auth" method="post" style="max-width:560px;">
  <h1>Оформление заказа</h1>
  <p class="sub">Заполните данные для доставки</p>

  <div class="form-group">
    <label>Имя и фамилия</label>
    <input type="text" required>
  </div>
  <div class="form-group">
    <label>Телефон</label>
    <input type="tel" required>
  </div>
  <div class="form-group">
    <label>Адрес доставки</label>
    <input type="text" required>
  </div>
  <button type="submit" class="btn btn-primary btn-full">Подтвердить заказ</button>
</form>
{% endblock %}
