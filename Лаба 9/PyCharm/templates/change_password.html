{% extends "base.html" %}
{% block title %}Смена пароля — Зоомагазин{% endblock %}

{% block content %}
<form class="auth" method="post" action="{{ url_for('change_password') }}" novalidate>
  <h1>Смена пароля</h1>
  <p class="sub">При первой авторизации смените пароль</p>

  <div class="form-group">
    <label>Текущий пароль</label>
    <input type="password" name="current" required autofocus>
  </div>
  <div class="form-group">
    <label>Новый пароль</label>
    <input type="password" name="new" required minlength="6">
  </div>
  <div class="form-group">
    <label>Подтверждение нового пароля</label>
    <input type="password" name="confirm" required minlength="6">
  </div>

  <button type="submit" class="btn btn-primary btn-full">Изменить пароль</button>
</form>
{% endblock %}
