{% extends "base.html" %}
{% block title %}Каталог — Зоомагазин{% endblock %}

{% block content %}

<div class="breadcrumbs"><a href="{{ url_for('index') }}">Главная</a> → Каталог</div>

<h1 style="margin-bottom:20px;">Все товары</h1>

<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:20px;">
  {% for i in range(1,9) %}
    <div style="background:#fff; border:1px solid #EEEEEE; border-radius:8px; padding:16px;">
      <div style="font-size:56px; text-align:center; margin-bottom:12px;">🐾</div>
      <h3 style="font-size:16px; margin-bottom:6px;">Товар №{{ i }}</h3>
      <p style="font-size:13px; color:#757575; margin-bottom:12px;">Описание товара</p>
      <p style="font-size:20px; font-weight:700; color:#2E7D32; margin-bottom:12px;">{{ 300 + i*100 }} ₽</p>
      <button class="btn btn-primary btn-full btn-sm">В корзину</button>
    </div>
  {% endfor %}
</div>

{% endblock %}
